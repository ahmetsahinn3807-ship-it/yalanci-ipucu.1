name: APK uret
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proje
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o yalanci-ipucu-android.zip -d proje
        working-directory: .
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Yazi tipleri
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts && cd app/src/main/assets/fonts
          curl -fsSL -o PatrickHand-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/patrickhand/PatrickHand-Regular.ttf"
          curl -fsSL -o Baloo2.ttf "https://github.com/google/fonts/raw/main/ofl/baloo2/Baloo2%5Bwght%5D.ttf"
          curl -fsSL -o Nunito.ttf "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk ../yalanci-ipucu-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Yalanci Ipucu ${{ github.run_number }}
          files: yalanci-ipucu-*.apk
